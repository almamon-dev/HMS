deptrac:
  paths:
    - ./app/Modules
  layers:
    - name: Domain
      collectors:
        - type: classLike
          value: ^App\\Modules\\[^\\]+\\Domain\\
    - name: Application
      collectors:
        - type: classLike
          value: ^App\\Modules\\[^\\]+\\Application\\
    - name: Infrastructure
      collectors:
        - type: classLike
          value: ^App\\Modules\\[^\\]+\\Infrastructure\\
    - name: Interfaces
      collectors:
        - type: classLike
          value: ^App\\Modules\\[^\\]+\\Interfaces\\
    - name: Providers
      collectors:
        - type: classLike
          value: ^App\\Modules\\[^\\]+\\Providers\\
  ruleset:
    Domain:
      - Domain
    Application:
      - Application
      - Domain
    Infrastructure:
      - Infrastructure
      - Application
      - Domain
    Interfaces:
      - Interfaces
      - Application
      - Domain
    Providers:
      - Providers
      - Application
      - Domain
      - Infrastructure
      - Interfaces
